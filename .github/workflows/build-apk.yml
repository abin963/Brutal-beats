name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "::error::Failed to detect active Java major version."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java version must be 17 or higher. Detected: $JAVA_MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified successfully (version >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Found APK file is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::File does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "APK verified successfully at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$ASSET_DIR"

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="${ASSET_DIR}/${RELEASE_FILENAME}"

          cp "$SOURCE_APK" "$TARGET_APK"

          if [ ! -s "$TARGET_APK" ]; then
            echo "::error::Failed to prepare release asset at: $TARGET_APK"
            exit 1
          fi

          echo "Release asset prepared: $TARGET_APK"
          echo "asset_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_NAME" in
            *.apk) ;;
            *)
              echo "::error::Release asset must have .apk extension: $ASSET_NAME"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### 📱 Brutal Beats Debug APK Build

          This is an automatically generated debug APK build for testing purposes.

          - **Build Run Number:** #${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA:** \`${GITHUB_SHA}\`
          - **Built By:** GitHub Actions
          - **Asset Name:** \`${ASSET_NAME}\`

          > ⚠️ **Notice:** This APK is intended for testing and debugging. It is signed with a temporary Android debug keystore and is **not** a production Google Play Store release.

          Download the APK directly from the **Assets** section below to test on your Android device.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================================="
            echo "🎉 GITHUB RELEASE PUBLISHED SUCCESSFULLY"
            echo "=========================================================="
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Asset Filename: $ASSET_NAME"

            gh release view "$RELEASE_TAG"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Direct Release URL: $RELEASE_URL"

            {
              echo "### 🎉 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published to GitHub Releases:"
              echo "- 📦 **Release Asset:** \`${ASSET_NAME}\`"
              echo "- 🏷️ **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- 🔗 **Download APK:** [Direct Release Page](${RELEASE_URL})"
              echo ""
              echo "> 📲 You can download the APK directly onto your phone from the **Assets** section on the release page."
              echo "> 🛡️ **Backup:** The standard GitHub Actions artifact \`app-debug-apk\` is also available on this run."
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "=========================================================="
            echo "⚠️ WARNING: GITHUB RELEASE PUBLISHING DID NOT COMPLETE"
            echo "=========================================================="
            echo "The APK build and artifact upload succeeded, but GitHub Release creation failed."
            echo "The debug APK is safely preserved as a workflow artifact named 'app-debug-apk'."

            {
              echo "### ⚠️ Debug APK Built (Release Publishing Warning)"
              echo ""
              echo "The debug APK was **built successfully** and preserved as an Actions artifact:"
              echo "- 📦 **Artifact Name:** \`app-debug-apk\` (available under Workflow Run Artifacts)"
              echo "- ⚠️ GitHub Release creation could not be completed or was skipped."
              echo "- ℹ️ You can download the APK from the Actions summary artifact section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
